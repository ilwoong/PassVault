# ARC-04: 버전은 전부 여기서만 관리한다. 스펙 문서에는 버전을 적지 않는다.
# 의존성 추가 기준: 비밀을 다루는 경로에는 새 의존성을 넣지 않는다.
# 네트워크 라이브러리는 추이적으로도 들어오면 안 된다 (NFR-03).
[versions]
agp = "9.2.1"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.29"
hilt = "2.59"
composeBom = "2026.02.01"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
coroutines = "1.9.0"
orgJson = "20260814"
androidxTestRunner = "1.7.0"
argon2kt = "1.6.0"
room = "2.8.5"
sqlcipher = "4.19.1"
androidxHilt = "1.3.0"
navigation = "2.9.8"
biometric = "1.1.0"
fragment = "1.9.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# CRY-07: 생체 해제. 1.1.0 이 마지막 안정판 (이후는 alpha)
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# BiometricPrompt 는 FragmentActivity 를 요구한다. biometric 1.1.0 이 끄는 1.2.5 대신 최신 안정판으로 맞춘다
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# CRY-02: Argon2id JNI 바인딩. 순수 JVM 구현은 성능이 부족하다 (ARC-04)
argon2kt = { group = "com.lambdapioneer.argon2kt", name = "argon2kt", version.ref = "argon2kt" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# CRY-05: DB 전체 암호화. raw key 모드로 연다
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# JVM 테스트용. 운영 코드는 Android 내장 org.json 을 쓴다 (BK-02)
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
# Compose UI 테스트가 끌고 오는 Espresso 3.5 는 최신 API 에서 InputManager 리플렉션이 깨진다
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
